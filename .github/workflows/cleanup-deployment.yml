name: Cleanup deployment record

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=6894666185
          sha=$(gh api repos/${{ github.repository }}/deployments/$id --jq '.sha')
          echo "deployment $id -> $sha"
          case "$sha" in 080b07f*) ;; *) echo "unexpected sha, refusing to delete"; exit 1;; esac
          gh api -X POST repos/${{ github.repository }}/deployments/$id/statuses -f state=inactive --silent
          gh api -X DELETE repos/${{ github.repository }}/deployments/$id
          echo "deleted"
