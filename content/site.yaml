# Page-level settings. Your actual content lives in the other files in this folder.

# Text shown in search results and link previews. If empty, your tagline is used.
description: "[Your Name] — computational biologist working on single-cell transcriptomics of aging and exercise."

# Order of sections on the page. Delete a line to hide that section.
# Sections whose content file is empty are hidden automatically.
sections:
  - about
  - projects
  - experience
  - skills
  - publications
  - news
  - education
  - contact

# Name variants to bold in publication author lists (as they appear in BibTeX)
highlight_authors:
  - "[Your Name]"

hero:
  # Labels drawn next to the clusters of the animated point cloud
  clusters: [ZG, ZF, ZR, Chromaffin, EC, Fib, Mac, T cell, Hep]
